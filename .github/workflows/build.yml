name: Build deb

on:
  push:
  workflow_dispatch:

env:
  IMGUI_VERSION: v1.91.5
  THEOS: /home/runner/theos

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl git zstd
          sudo apt-get install -y libtinfo5 || sudo apt-get install -y libncurses5 || true

      - name: Cache Theos (toolchain + SDKs)
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: theos-linux-v1

      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Fetch ImGui
        run: |
          mkdir -p vendor
          git clone --depth 1 --branch "$IMGUI_VERSION" https://github.com/ocornut/imgui.git vendor/imgui

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: TrueSkateMenu-deb
          path: packages/*.deb
